spec:
  inputs:
    version:
      description: "Version of Vite+ to install; empty resolves from the project."
      default: ""
    version-file:
      description: "Vite+ version file relative to working-directory."
      default: ""
    node-version:
      description: "Node.js version to select with vp env use."
      default: ""
    node-version-file:
      description: "Node.js version file relative to working-directory."
      default: ""
    cache-dependency-path:
      description: "Lock file relative to working-directory; otherwise auto-detect."
      default: ""
    cache-policy:
      description: "Native cache policy for .setup-vp-cached; pull restores without saving."
      default: "pull-push"
      options: ["pull", "pull-push"]
    cache-namespace:
      description: "Cache partition; use an OS/architecture label to share across compatible runners."
      default: "$CI_RUNNER_ID"
    working-directory:
      description: "Project directory used for relative paths and default `vp install` execution."
      default: "."
    run-install:
      description: 'Run `vp install` after setup. This is a string input: use "true"/"false" or a YAML object/list with cwd/args.'
      default: "true"
    sfw:
      description: "Wrap `vp install` with Socket Firewall Free (`sfw`) to block malicious dependency fetches."
      type: boolean
      default: false
    package-manager:
      description: 'Control Vite+ package-manager management (0.3.1+). Use "true", "false", or a YAML mapping of npm, pnpm, yarn, and bun to booleans. Unspecified managers keep the installer default (enabled on CI). Any explicit configuration requires 0.3.1+.'
      default: ""
    node-manager:
      description: 'Control Vite+''s Node.js version manager. This is a string input: empty (default) lets the Vite+ installer decide (enabled on CI); "false" keeps the runner image''s Node.js (makes vp commands prefer the system Node.js after installation); "true" leaves the installer default unchanged.'
      default: ""
    registry-url:
      description: "Optional registry URL to write to a temporary .npmrc. Auth token is read from NODE_AUTH_TOKEN."
      default: ""
    scope:
      description: "Optional scope for authenticating against scoped registries."
      default: ""
    setup-ref:
      description: "setup-vp ref used to download the GitLab bootstrap and compiled runtime. Pin this to the same tag or commit as the remote template; the default is the latest release when this template was published."
      default: "v1.21.1"
      regex: '\A[A-Za-z0-9_-]+([./][A-Za-z0-9_-]+)*\z'
---
.setup-vp-bootstrap:
  before_script:
    - |
      set -eu

      setup_vp_download() {
        setup_vp_url="$1"
        setup_vp_out="$2"

        if command -v curl >/dev/null 2>&1; then
          curl -fsSL --connect-timeout 5 --max-time 60 "$setup_vp_url" -o "$setup_vp_out"
        elif command -v wget >/dev/null 2>&1; then
          wget -q -T 60 -t 2 -O "$setup_vp_out" "$setup_vp_url"
        else
          echo "setup-vp: curl or wget is required to download the GitLab bootstrap." >&2
          return 127
        fi
      }

      export SETUP_VP_VERSION="${SETUP_VP_VERSION:-}"
      export SETUP_VP_VERSION_FILE="${SETUP_VP_VERSION_FILE:-}"
      export SETUP_VP_NODE_VERSION="${SETUP_VP_NODE_VERSION:-}"
      export SETUP_VP_NODE_VERSION_FILE="${SETUP_VP_NODE_VERSION_FILE:-}"
      export SETUP_VP_CACHE_DEPENDENCY_PATH="${SETUP_VP_CACHE_DEPENDENCY_PATH:-}"
      export SETUP_VP_WORKING_DIRECTORY="${SETUP_VP_WORKING_DIRECTORY:-.}"
      export SETUP_VP_RUN_INSTALL="${SETUP_VP_RUN_INSTALL:-true}"
      export SETUP_VP_SFW="${SETUP_VP_SFW:-false}"
      export SETUP_VP_PACKAGE_MANAGER="${SETUP_VP_PACKAGE_MANAGER:-}"
      export SETUP_VP_NODE_MANAGER="${SETUP_VP_NODE_MANAGER:-}"
      export SETUP_VP_REGISTRY_URL="${SETUP_VP_REGISTRY_URL:-}"
      export SETUP_VP_SCOPE="${SETUP_VP_SCOPE:-}"
      export SETUP_VP_SETUP_REF="${SETUP_VP_SETUP_REF:-v1.21.1}"

      # Keep this check POSIX-compatible: the runner may use sh before Bash starts.
      case "$SETUP_VP_SETUP_REF" in
        *[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_./-]*|[./]*|*[./]|*..*|*./*|*/.*|*//*)
          echo 'setup-vp: invalid setup-ref; use a tag, branch or commit SHA with safe ref characters.' >&2
          exit 1
          ;;
      esac

      setup_vp_bootstrap_tmp="$(mktemp "${TMPDIR:-/tmp}/setup-vp-gitlab-bootstrap.XXXXXX")"
      setup_vp_env_tmp="$(mktemp "${TMPDIR:-/tmp}/setup-vp-gitlab-env.XXXXXX")"
      chmod 600 "$setup_vp_env_tmp"
      export SETUP_VP_ENV_FILE="$setup_vp_env_tmp"
      trap 'rm -f "$setup_vp_bootstrap_tmp" "$setup_vp_env_tmp"' EXIT
      setup_vp_bootstrap_url="https://raw.githubusercontent.com/voidzero-dev/setup-vp/${SETUP_VP_SETUP_REF}/gitlab/bootstrap.sh"
      setup_vp_download "$setup_vp_bootstrap_url" "$setup_vp_bootstrap_tmp"
      bash "$setup_vp_bootstrap_tmp"
      . "$setup_vp_env_tmp"

.setup-vp:
  # Keep string inputs out of shell source and disable variable expansion.
  variables:
    SETUP_VP_INPUT_VERSION:
      value: $[[ inputs.version ]]
      expand: false
    SETUP_VP_INPUT_VERSION_FILE:
      value: $[[ inputs.version-file ]]
      expand: false
    SETUP_VP_INPUT_NODE_VERSION:
      value: $[[ inputs.node-version ]]
      expand: false
    SETUP_VP_INPUT_NODE_VERSION_FILE:
      value: $[[ inputs.node-version-file ]]
      expand: false
    SETUP_VP_INPUT_CACHE_DEPENDENCY_PATH:
      value: $[[ inputs.cache-dependency-path ]]
      expand: false
    SETUP_VP_INPUT_WORKING_DIRECTORY:
      value: $[[ inputs.working-directory ]]
      expand: false
    SETUP_VP_INPUT_RUN_INSTALL:
      value: $[[ inputs.run-install ]]
      expand: false
    SETUP_VP_INPUT_PACKAGE_MANAGER:
      value: $[[ inputs.package-manager ]]
      expand: false
    SETUP_VP_INPUT_NODE_MANAGER:
      value: $[[ inputs.node-manager ]]
      expand: false
    SETUP_VP_INPUT_REGISTRY_URL:
      value: $[[ inputs.registry-url ]]
      expand: false
    SETUP_VP_INPUT_SCOPE:
      value: $[[ inputs.scope ]]
      expand: false
    SETUP_VP_INPUT_SETUP_REF:
      value: $[[ inputs.setup-ref ]]
      expand: false
  before_script:
    - |
      # Copy inputs at runtime so they still override SETUP_VP_* variables.
      export SETUP_VP_VERSION="$SETUP_VP_INPUT_VERSION"
      export SETUP_VP_VERSION_FILE="$SETUP_VP_INPUT_VERSION_FILE"
      export SETUP_VP_NODE_VERSION="$SETUP_VP_INPUT_NODE_VERSION"
      export SETUP_VP_NODE_VERSION_FILE="$SETUP_VP_INPUT_NODE_VERSION_FILE"
      export SETUP_VP_CACHE_DEPENDENCY_PATH="$SETUP_VP_INPUT_CACHE_DEPENDENCY_PATH"
      export SETUP_VP_WORKING_DIRECTORY="$SETUP_VP_INPUT_WORKING_DIRECTORY"
      export SETUP_VP_RUN_INSTALL="$SETUP_VP_INPUT_RUN_INSTALL"
      export SETUP_VP_PACKAGE_MANAGER="$SETUP_VP_INPUT_PACKAGE_MANAGER"
      export SETUP_VP_NODE_MANAGER="$SETUP_VP_INPUT_NODE_MANAGER"
      export SETUP_VP_REGISTRY_URL="$SETUP_VP_INPUT_REGISTRY_URL"
      export SETUP_VP_SCOPE="$SETUP_VP_INPUT_SCOPE"
      export SETUP_VP_SETUP_REF="$SETUP_VP_INPUT_SETUP_REF"
      # GitLab validates these inputs as a boolean and a fixed option list.
      export SETUP_VP_SFW='$[[ inputs.sfw ]]'
      if [ '$[[ inputs.cache-policy ]]' = 'pull' ]; then export SETUP_VP_CACHE_SAVE=false; fi
    - !reference [.setup-vp-bootstrap, before_script]

# Opt in to native GitLab persistence without replacing an existing job cache.
.setup-vp-cached:
  extends: .setup-vp
  variables:
    SETUP_VP_CACHE: "true"
  after_script:
    - |
      if [ -f "$CI_PROJECT_DIR/.setup-vp-cache-state.json" ]; then
        node "$CI_PROJECT_DIR/.setup-vp-runtime.mjs" save-cache
      fi
  cache:
    key: "setup-vp-v2-$[[ inputs.cache-namespace ]]-$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG"
    fallback_keys:
      - "setup-vp-v2-$[[ inputs.cache-namespace ]]-$CI_JOB_NAME_SLUG-$CI_DEFAULT_BRANCH"
    paths:
      - .setup-vp-cache/
    policy: $[[ inputs.cache-policy ]]
