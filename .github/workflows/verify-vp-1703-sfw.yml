name: verify-vp-1703-sfw

# One-off verification: does voidzero-dev/vite-plus#1703 (the v0.1.23
# release PR that incorporates #1686's centralized HTTP client + proxy +
# custom-CA support) actually fix the macOS/Windows `sfw vp install` TLS
# handshake regression that gated us to Linux in setup-vp#73?
#
# Uses the pkg-pr-new build from
# https://github.com/voidzero-dev/vite-plus/pull/1703#issuecomment-4563899128
# (commit d0b407c). Bypasses setup-vp's own bootstrap so the only thing
# under test is the vp+sfw interaction. sfw is installed manually from
# the same upstream URL setup-vp uses — NOT via socketdev/action — so
# there is no SFW_JSON_REPORT_PATH side-effect on stdout output, and we
# can grep for the literal block-line.
#
# Triggers only on pushes that touch this file (paths filter) — so it runs
# once when we add/update the workflow itself and stays quiet on every
# other commit to the branch. Delete this file once v0.1.23 ships (or
# another build arrives that we want to test).

on:
  push:
    paths:
      - ".github/workflows/verify-vp-1703-sfw.yml"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: "22"

      - name: Create test project with a real dependency
        shell: bash
        run: |
          mkdir -p test-project
          cd test-project
          echo '{"name":"test-project","private":true,"dependencies":{"is-odd":"^3.0.1"}}' > package.json

      - name: Install vp from pkg-pr-new (PR #1703 / d0b407c, v0.1.23 release)
        shell: bash
        run: |
          npm i -g https://pkg.pr.new/voidzero-dev/vite-plus@1703
          vp --version

      - name: Install sfw (same URL setup-vp would use, no socketdev/action)
        shell: bash
        # Replicates `installSfw()` from src/install-sfw.ts exactly — same
        # pinned version, same per-OS asset, no SFW_JSON_REPORT_PATH side
        # effect from socketdev/action. This isolates the vp+sfw TLS
        # interaction with nothing else in the way.
        run: |
          SFW_VERSION=v1.11.0
          BIN_DIR="$RUNNER_TEMP/sfw-bin"
          mkdir -p "$BIN_DIR"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    ASSET=sfw-free-linux-x86_64;  BIN=sfw ;;
            Linux-ARM64)  ASSET=sfw-free-linux-arm64;   BIN=sfw ;;
            macOS-ARM64)  ASSET=sfw-free-macos-arm64;   BIN=sfw ;;
            macOS-X64)    ASSET=sfw-free-macos-x86_64;  BIN=sfw ;;
            Windows-X64)  ASSET=sfw-free-windows-x86_64.exe; BIN=sfw.exe ;;
            Windows-ARM64) ASSET=sfw-free-windows-arm64.exe; BIN=sfw.exe ;;
            *) echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          URL="https://github.com/SocketDev/sfw-free/releases/download/$SFW_VERSION/$ASSET"
          echo "Downloading $URL"
          curl -fsSL --connect-timeout 5 --max-time 60 -o "$BIN_DIR/$BIN" "$URL"
          chmod +x "$BIN_DIR/$BIN" || true
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Confirm sfw is on PATH (no socketdev/action involvement)
        shell: bash
        run: |
          sfw --version
          # Sanity-check: socketdev/action's env var must NOT be set
          if [ -n "${SFW_JSON_REPORT_PATH:-}" ]; then
            echo "::error::SFW_JSON_REPORT_PATH is set; socketdev/action contamination?"
            exit 1
          fi
          echo "OK: clean environment, sfw will print block reports to stdout"

      - name: Run `sfw vp install` on the benign project
        shell: bash
        working-directory: test-project
        # The headline test. Pre-#1686, this failed on macOS/Windows with
        # `tlsv1 alert unknown ca` because vp's reqwest didn't honor
        # HTTPS_PROXY and didn't trust SSL_CERT_FILE. #1703 (v0.1.23) ships
        # #1686's client refactor; this should pass on all three OSes now.
        run: sfw vp install

      - name: Verify the dependency landed (proves install actually ran)
        shell: bash
        working-directory: test-project
        run: vp exec node -e "console.log(require('is-odd')(3))"

      - name: Try the lodahs canary (should still BLOCK on all OSes)
        shell: bash
        working-directory: test-project
        # If everything above worked, this is the proof that sfw isn't just
        # passing traffic through unchanged — it's actually inspecting and
        # blocking malware on macOS/Windows too.
        run: |
          set +e
          OUTPUT=$(sfw vp install lodahs 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::sfw failed to block lodahs on ${{ matrix.os }} — install exited 0"
            exit 1
          fi
          if ! printf '%s' "$OUTPUT" | grep -qF -- "blocked npm package: name: lodahs"; then
            echo "::error::sfw vp install exited $CODE but the lodahs block-line was not in the output on ${{ matrix.os }}"
            exit 1
          fi
          echo "OK: sfw blocked lodahs on ${{ matrix.os }} (exit $CODE, block-line found)"

  verify-alpine:
    # Same flow as the matrix above, but inside an alpine:3.23 container so we
    # exercise the musl asset (sfw-free-musl-linux-x86_64). vp's PR #1703
    # (v0.1.23, incorporating #1686) has to honor HTTPS_PROXY + SSL_CERT_FILE
    # in the musl build the same way it does in the glibc build.
    runs-on: ubuntu-latest
    container:
      image: alpine:3.23
    steps:
      - name: Install Alpine dependencies (bash, curl, libstdc++ for sfw)
        run: apk add --no-cache bash curl gcompat libstdc++ nodejs npm

      - name: Create test project with a real dependency
        shell: bash
        run: |
          mkdir -p test-project
          cd test-project
          echo '{"name":"test-project","private":true,"dependencies":{"is-odd":"^3.0.1"}}' > package.json

      - name: Install vp from pkg-pr-new (PR #1703 / d0b407c, v0.1.23 release)
        shell: bash
        run: |
          npm i -g https://pkg.pr.new/voidzero-dev/vite-plus@1703
          vp --version

      - name: Install sfw (musl asset)
        shell: bash
        run: |
          SFW_VERSION=v1.11.0
          BIN_DIR="$RUNNER_TEMP/sfw-bin"
          mkdir -p "$BIN_DIR"
          ASSET=sfw-free-musl-linux-x86_64
          URL="https://github.com/SocketDev/sfw-free/releases/download/$SFW_VERSION/$ASSET"
          echo "Downloading $URL"
          curl -fsSL --connect-timeout 5 --max-time 60 -o "$BIN_DIR/sfw" "$URL"
          chmod +x "$BIN_DIR/sfw"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Confirm sfw is on PATH (musl)
        shell: bash
        run: |
          sfw --version
          if [ -n "${SFW_JSON_REPORT_PATH:-}" ]; then
            echo "::error::SFW_JSON_REPORT_PATH is set; clean-env invariant broken"
            exit 1
          fi

      - name: Run `sfw vp install` on the benign project (musl)
        shell: bash
        working-directory: test-project
        run: sfw vp install

      - name: Verify the dependency landed (musl)
        shell: bash
        working-directory: test-project
        run: vp exec node -e "console.log(require('is-odd')(3))"

      - name: Try the lodahs canary (musl, should still BLOCK)
        shell: bash
        working-directory: test-project
        run: |
          set +e
          OUTPUT=$(sfw vp install lodahs 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::sfw failed to block lodahs on alpine — install exited 0"
            exit 1
          fi
          if ! printf '%s' "$OUTPUT" | grep -qF -- "blocked npm package: name: lodahs"; then
            echo "::error::sfw vp install exited $CODE but the lodahs block-line was not in the output on alpine"
            exit 1
          fi
          echo "OK: sfw blocked lodahs on alpine (exit $CODE, block-line found)"
