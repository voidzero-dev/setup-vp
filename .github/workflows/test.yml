name: Setup Node preview benchmark
run-name: Node bootstrap benchmark at ${{ inputs.preview_sha }}
on:
  workflow_dispatch:
    inputs:
      preview_sha:
        description: Exact Vite+ preview commit
        required: true
        default: 65f9bc56f1f2d87e138013c5bcde9e7306d8eeb8
      smoke:
        description: Run one Linux sample only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.os }} sample ${{ matrix.sample }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: ${{ fromJSON(inputs.smoke && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        sample: ${{ fromJSON(inputs.smoke && '[0]' || '[0, 1, 2, 3, 4, 5]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Benchmark fresh installations
        run: node test/benchmark-project-node.js
        env:
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          BENCHMARK_SAMPLE: ${{ matrix.sample }}
      - name: Upload timings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-${{ matrix.os }}-${{ matrix.sample }}
          path: |
            benchmark-results/results.json
            benchmark-results/*.jsonl
            benchmark-results/*.log
          if-no-files-found: error
