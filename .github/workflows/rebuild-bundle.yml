name: Rebuild action bundle
run-name: "Rebuild PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

# The `needs-bundle-rebuild` label (Renovate adds it for bumps to deps compiled
# into dist/, or to the vite-plus bundler) triggers a read-only build.
# A maintainer dispatches publish-bundle.yml on main to commit a reviewed build.
# `synchronize` retries after rebases; publishing stops when dist/ is unchanged.
# The publisher verifies this workflow's Git blob before trusting its run name.
on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

concurrency:
  group: rebuild-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: rebuild bundle
    # Only for labeled PRs (on the `labeled` event the just-added label is
    # already in the array), and only same-repo branches we can push back to
    # (Renovate PRs are same-repo; fork PRs can't be pushed to).
    if: >-
      contains(github.event.pull_request.labels.*.name, 'needs-bundle-rebuild') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned to a full commit SHA (org policy).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # pnpm version is read from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild the action bundle
        run: pnpm build

      - name: Upload rebuilt bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-bundles-${{ github.run_attempt }}
          path: |
            dist/index.mjs
            dist/gitlab/index.mjs
            dist/azure/index.mjs
          if-no-files-found: error
          retention-days: 1
